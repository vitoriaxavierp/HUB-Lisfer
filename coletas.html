<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coletas — Hub Lisfer</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="hub.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<style>
  /* ---------- navegação de data ---------- */
  .date-nav { display: flex; align-items: center; gap: 6px; }
  .date-pick {
    position: relative; display: flex; align-items: center; gap: 10px;
    height: 38px; padding: 0 14px; min-width: 210px;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md);
    box-shadow: var(--shadow-xs);
  }
  .date-pick:hover { border-color: var(--text-3); }
  .date-pick:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
  .date-pick svg { width: 16px; height: 16px; color: var(--text-3); flex: none; }
  .date-pick .wd { font-weight: 600; }
  .date-pick .dt { font-family: var(--font-mono); color: var(--text-2); font-size: var(--fs-sm); }
  .date-pick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; }
  .date-today { font-size: var(--fs-xs); font-weight: 600; color: var(--brand-text); background: var(--brand-soft); border-radius: var(--r-pill); padding: 1px 7px; margin-left: auto; }

  /* ---------- formulário ---------- */
  .f-cliente { grid-column: span 5; } .f-doc { grid-column: span 4; } .f-whats { grid-column: span 3; }
  .f-vend { grid-column: span 3; } .f-data { grid-column: span 3; } .f-tipo { grid-column: span 3; } .f-transp, .f-me { grid-column: span 3; }
  .f-rastreio { grid-column: span 6; } .f-pedido, .f-nf, .f-vol { grid-column: span 2; }
  .f-obs { grid-column: 1 / -1; }
  .form-grid .field.is-off { display: none; }
  .doc-group .input { flex: 1; }
  @media (max-width: 1100px) {
    .f-cliente, .f-doc { grid-column: span 6; } .f-whats, .f-vend, .f-data, .f-tipo, .f-transp, .f-me { grid-column: span 4; }
    .f-rastreio { grid-column: span 6; } .f-pedido, .f-nf, .f-vol { grid-column: span 2; }
  }

  /* ---------- lista de coletas ---------- */
  .list-head { display: flex; align-items: center; gap: 10px; }
  .list-head .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .list-head.is-pending .dot { background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .list-head.is-done .dot { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }

  .order {
    display: grid; grid-template-columns: 36px minmax(0, 1fr) auto auto; gap: 4px 16px; align-items: start;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    transition: background var(--t-fast) ease;
  }
  .order:last-child { border-bottom: 0; }
  .order:hover { background: var(--surface-2); }
  .order.is-done .o-cliente { color: var(--text-2); }

  .status-btn {
    width: 32px; height: 32px; border-radius: 50%; flex: none; margin-top: 1px;
    display: grid; place-items: center; border: 0; background: var(--brand-soft);
    box-shadow: inset 0 0 0 2px var(--brand);
    transition: box-shadow var(--t-fast) ease, background var(--t-fast) ease, transform var(--t-fast) ease;
  }
  .status-btn::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); transition: transform var(--t-fast) ease; }
  .status-btn:hover { box-shadow: inset 0 0 0 2px var(--success); background: var(--success-soft); }
  .status-btn:hover::after { transform: scale(0.6); background: var(--success); }
  .status-btn:active { transform: scale(0.94); }
  .status-btn.is-done { background: var(--success); box-shadow: none; }
  .status-btn.is-done::after { display: none; }
  .status-btn.is-done svg { width: 16px; height: 16px; color: #FFFFFF; }
  .status-btn.is-done:hover { background: #156330; }
  .status-btn[aria-busy="true"] { opacity: 0.6; pointer-events: none; }
  .order.just-done { animation: done-row 900ms ease-out; }
  .order.just-done .status-btn { animation: done-pop 260ms var(--ease-out); }
  .order.just-done .status-btn svg { animation: done-check 260ms var(--ease-out) 60ms backwards; }
  @keyframes done-pop { from { transform: scale(0.7); } to { transform: none; } }
  @keyframes done-check { from { opacity: 0; transform: scale(0.4) rotate(-12deg); } to { opacity: 1; transform: none; } }
  @keyframes done-row { from { background: var(--success-soft); } to { background: transparent; } }

  .o-main { min-width: 0; }
  .o-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .o-cliente { font-size: var(--fs-md); font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .o-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 4px; font-size: var(--fs-sm); color: var(--text-3); }
  .o-meta .item { display: inline-flex; align-items: center; gap: 5px; }
  .o-meta svg { width: 13px; height: 13px; flex: none; }
  .o-meta .mono { color: var(--text-2); }
  .o-meta .done-by { color: var(--success); font-weight: 500; }
  .o-obs {
    margin-top: 10px; padding: 8px 12px; border-radius: var(--r-md);
    background: var(--surface-3); font-size: var(--fs-sm); color: var(--text); line-height: 1.45; overflow-wrap: anywhere;
  }
  .o-obs b { font-weight: 600; color: var(--text-2); margin-right: 6px; }

  .o-nums { display: flex; gap: 18px; padding-top: 2px; }
  .o-nums div { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .o-nums .k { font-size: var(--fs-2xs); color: var(--text-3); }
  .o-nums .v { font-family: var(--font-mono); font-size: var(--fs-base); font-weight: 500; color: var(--text); white-space: nowrap; }
  .o-actions { display: flex; gap: 2px; }

  .rastreio { display: inline-flex; align-items: center; gap: 4px; }
  .rastreio a { display: inline-flex; align-items: center; gap: 5px; color: var(--text); font-weight: 500; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  .rastreio a:hover { text-decoration-color: currentColor; }
  .rastreio .icon-btn { width: 24px; height: 24px; }
  .rastreio .icon-btn svg { width: 13px; height: 13px; }
  .rastreio-add { display: inline-flex; align-items: center; gap: 4px; border: 1px dashed var(--border-strong); background: transparent; color: var(--text-2); border-radius: var(--r-pill); height: 22px; padding: 0 9px 0 7px; font-size: var(--fs-xs); font-weight: 600; }
  .rastreio-add svg { width: 12px; height: 12px; }
  .rastreio-add:hover { border-color: var(--ink); color: var(--text); }
  .rastreio-input { height: 28px; min-width: 260px; font-family: var(--font-mono); font-size: var(--fs-xs); }

  .order.is-editing { display: block; background: var(--surface-2); padding: 20px; }
  .panel-head:has(+ form[hidden]) { border-bottom: 0; }
  #toggleForm svg { transition: transform var(--t-base) var(--ease-out); }
  #toggleForm[aria-expanded="false"] svg { transform: rotate(-90deg); }
  .edit-title { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); margin-bottom: 14px; }

  @media (max-width: 760px) {
    .date-nav { width: 100%; flex-wrap: nowrap; }
    .date-pick { flex: 1; min-width: 0; padding: 0 10px; gap: 8px; }
    .date-pick .wd { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .date-pick .yr, .date-today, #reqNote { display: none; }
    .order { grid-template-columns: 36px minmax(0, 1fr) auto; }
    .o-nums { grid-column: 2 / -1; grid-row: 2; justify-content: flex-start; }
    .o-nums div { align-items: flex-start; }
    .o-actions { grid-column: 3; grid-row: 1; }
  }
</style>
</head>
<body>

<div class="app" id="appScreen" hidden>
  <aside class="app-sidebar" id="appSidebar" data-active="coletas"></aside>
  <div class="app-scrim"></div>
  <div class="app-main">
    <main class="page">
      <header class="page-header">
        <div class="page-header-text">
          <h1 class="page-title">Coletas</h1>
          <p class="page-desc">Retiradas do dia. Tudo o que é lançado aqui aparece na hora para toda a equipe.</p>
        </div>
        <div class="page-actions date-nav">
          <button class="icon-btn" id="prevDay" aria-label="Dia anterior" title="Dia anterior"></button>
          <label class="date-pick" title="Escolher data">
            <span id="calIcon"></span>
            <span class="wd" id="weekdayLabel">—</span>
            <span class="dt" id="dateLabel">--/--</span>
            <span class="date-today" id="isTodayTag" hidden>hoje</span>
            <input type="date" id="dateJump" aria-label="Ir para a data">
          </label>
          <button class="icon-btn" id="nextDay" aria-label="Próximo dia" title="Próximo dia"></button>
          <button class="btn btn-secondary" id="todayBtn">Hoje</button>
        </div>
      </header>

      <div class="stack">
        <div class="alert alert-danger" id="connBanner" role="alert" hidden>
          <span id="connIcon"></span>
          <span><strong>Não foi possível carregar as coletas.</strong> Verifique a conexão e recarregue a página.</span>
        </div>

        <section class="panel" aria-labelledby="novaTitle">
          <div class="panel-head">
            <h2 id="novaTitle">Nova coleta</h2>
            <span class="panel-sub" id="reqNote">Campos com <span style="color:var(--danger)">*</span> são obrigatórios</span>
            <span class="spacer"></span>
            <button type="button" class="btn btn-ghost btn-sm" id="toggleForm" aria-expanded="true" aria-controls="entryForm"></button>
          </div>
          <form id="entryForm" novalidate>
            <div class="panel-body form-grid">
              <div class="field f-cliente">
                <label for="clienteInput">Cliente<span class="req">*</span></label>
                <input class="input" type="text" id="clienteInput" autocomplete="off" required>
              </div>
              <div id="docFieldSlot"></div>
              <div class="field f-whats">
                <label for="whatsappInput">WhatsApp do contato</label>
                <input class="input mono" type="tel" id="whatsappInput" placeholder="(11) 91234-5678" autocomplete="off">
              </div>

              <div class="field f-vend">
                <label for="vendedoraInput">Vendedora<span class="req">*</span></label>
                <select class="select" id="vendedoraInput" required></select>
              </div>
              <div class="field f-data">
                <label for="dataColetaInput">Dia da coleta<span class="req">*</span></label>
                <input class="input" type="date" id="dataColetaInput" required>
              </div>
              <div class="field f-tipo">
                <label for="tipoInput">Tipo de coleta</label>
                <select class="select" id="tipoInput">
                  <option value="transportadora">Transportadora</option>
                  <option value="uber">Uber</option>
                  <option value="retirada">Retirada pessoal</option>
                  <option value="melhor_envio">Melhor Envio</option>
                </select>
              </div>
              <div class="field f-transp is-off" id="transportadoraField">
                <label for="transportadoraInput">Transportadora</label>
                <input class="input" type="text" id="transportadoraInput" placeholder="ex.: Jamef, Braspress" autocomplete="off">
              </div>
              <div class="field f-me is-off" id="melhorEnvioField">
                <label for="melhorEnvioInput">Serviço do Melhor Envio</label>
                <select class="select" id="melhorEnvioInput">
                  <option value="jadlog_com">Jadlog .com</option>
                  <option value="jadlog_package">Jadlog .package</option>
                  <option value="jadlog_package_centralizado">Jadlog .package centralizado</option>
                  <option value="correios">Correios</option>
                </select>
              </div>

              <div class="field f-rastreio is-off" id="rastreioField">
                <label for="rastreioInput">Link de rastreio</label>
                <input class="input mono" type="text" id="rastreioInput" placeholder="cole o link, se já tiver" autocomplete="off">
              </div>
              <div class="field f-pedido">
                <label for="pedidoInput">Nº do pedido</label>
                <input class="input mono" type="text" id="pedidoInput" autocomplete="off">
              </div>
              <div class="field f-nf">
                <label for="nfInput">NF<span class="req">*</span></label>
                <input class="input mono" type="text" id="nfInput" autocomplete="off" required>
              </div>
              <div class="field f-vol">
                <label for="volInput">Volumes<span class="req">*</span></label>
                <input class="input mono" type="number" id="volInput" min="1" step="1" value="1" required>
              </div>

              <div class="field f-obs">
                <label for="obsInput">Observações <span class="muted">— o que tem no pedido</span></label>
                <textarea class="textarea" id="obsInput" rows="2" placeholder="ex.: 5 LF-0303, 2 LX-0178"></textarea>
              </div>
            </div>
            <div class="panel-foot">
              <button type="submit" class="btn btn-primary" id="addBtn"><span id="addIcon"></span>Adicionar coleta</button>
              <div class="form-error" id="formMsg" role="alert"></div>
            </div>
          </form>
        </section>

        <section class="panel" aria-labelledby="pendTitle">
          <div class="panel-head list-head is-pending">
            <span class="dot" aria-hidden="true"></span>
            <h2 id="pendTitle">Pendentes</h2>
            <span class="count-pill" id="pendingCount">–</span>
            <span class="spacer"></span>
            <span class="panel-sub">Clique no círculo para dar baixa</span>
          </div>
          <div id="pendingList" aria-live="polite">
            <div class="skeleton-row"><span class="skeleton" style="width:32px;height:32px;border-radius:50%"></span><span class="skeleton" style="height:13px;width:38%"></span><span class="skeleton" style="height:13px;width:16%;margin-left:auto"></span></div>
            <div class="skeleton-row"><span class="skeleton" style="width:32px;height:32px;border-radius:50%"></span><span class="skeleton" style="height:13px;width:30%"></span><span class="skeleton" style="height:13px;width:14%;margin-left:auto"></span></div>
          </div>
        </section>

        <section class="panel" aria-labelledby="doneTitle">
          <div class="panel-head list-head is-done">
            <span class="dot" aria-hidden="true"></span>
            <h2 id="doneTitle">Coletadas</h2>
            <span class="count-pill" id="collectedCount">–</span>
          </div>
          <div id="collectedList" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>
</div>

<script>
(function () {
  const ic = HubIcons.svg;
  const escapeHtml = HubUI.escapeHtml;
  const TIPO_ICON = { transportadora: 'truck', uber: 'car', retirada: 'person', melhor_envio: 'send' };
  const TIPO_LABELS = { transportadora: 'Transportadora', uber: 'Uber', retirada: 'Retirada pessoal', melhor_envio: 'Melhor Envio' };
  const ME_LABELS = {
    jadlog_com: 'Jadlog .com',
    jadlog_package: 'Jadlog .package',
    jadlog_package_centralizado: 'Jadlog .package centralizado',
    correios: 'Correios'
  };

  let currentUser = null;
  let channel = null;
  let currentDate = formatLocal(new Date());
  let lastOrders = [];
  let pendingDeleteId = null;
  let pendingDeleteTimeout = null;
  let editingRastreioId = null;
  let editingId = null;
  let editingRowElement = null;
  let justDoneId = null;

  const el = (id) => document.getElementById(id);
  const connBanner = el('connBanner');
  const entryForm = el('entryForm');
  const addBtn = el('addBtn');
  const formMsg = el('formMsg');

  el('prevDay').innerHTML = ic('chevronLeft');
  el('nextDay').innerHTML = ic('chevronRight');
  el('calIcon').outerHTML = ic('calendar');
  el('connIcon').outerHTML = ic('alertCircle');
  el('addIcon').outerHTML = ic('plus');

  // formulário recolhível (lembrado neste computador)
  const FORM_KEY = 'hub.coletas.formRecolhido';
  function setFormOpen(open) {
    entryForm.hidden = !open;
    el('reqNote').hidden = !open;
    const t = el('toggleForm');
    t.setAttribute('aria-expanded', open ? 'true' : 'false');
    t.innerHTML = ic('chevronDown') + '<span>' + (open ? 'Recolher' : 'Mostrar formulário') + '</span>';
    try { localStorage.setItem(FORM_KEY, open ? '0' : '1'); } catch (e) {}
  }
  let formInicial = true;
  try { formInicial = localStorage.getItem(FORM_KEY) !== '1'; } catch (e) {}
  setFormOpen(formInicial);
  el('toggleForm').addEventListener('click', () => {
    const open = entryForm.hidden;
    setFormOpen(open);
    if (open) el('clienteInput').focus();
  });

  const docField = buildDocField('cnpj', '');
  docField.element.classList.add('f-doc');
  el('docFieldSlot').replaceWith(docField.element);

  const tipoInput = el('tipoInput');
  const transportadoraField = el('transportadoraField');
  const transportadoraInput = el('transportadoraInput');
  const melhorEnvioField = el('melhorEnvioField');
  const melhorEnvioInput = el('melhorEnvioInput');
  const rastreioField = el('rastreioField');
  const rastreioInput = el('rastreioInput');

  function syncTipoFields() {
    const tipo = tipoInput.value;
    transportadoraField.classList.toggle('is-off', tipo !== 'transportadora');
    melhorEnvioField.classList.toggle('is-off', tipo !== 'melhor_envio');
    rastreioField.classList.toggle('is-off', tipo !== 'transportadora' && tipo !== 'melhor_envio');
  }
  tipoInput.addEventListener('change', syncTipoFields);
  syncTipoFields();

  function buildVendedoraOptions(selectEl, selectedId) {
    selectEl.innerHTML = '';
    HubAuth.profiles.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.nome || p.id;
      if (p.id === selectedId) o.selected = true;
      selectEl.appendChild(o);
    });
  }

  HubAuth.requireAuth((user) => {
    currentUser = user;
    buildVendedoraOptions(el('vendedoraInput'), user.id);
    el('appScreen').hidden = false;
    updateDateLabels();
    subscribe();
  });

  // ---------------- dados (Supabase) ----------------

  function mapRowToOrder(row) {
    return {
      id: row.id,
      dataColeta: row.data_coleta,
      cliente: row.cliente,
      documento: row.documento,
      documentoTipo: row.documento_tipo,
      whatsapp: row.whatsapp,
      vendedoraId: row.vendedora_id,
      vendedora: HubAuth.nomeDe(row.vendedora_id),
      numeroPedido: row.numero_pedido,
      nf: row.nf,
      volumes: row.volumes,
      obs: row.obs,
      tipoColeta: row.tipo_coleta,
      transportadoraNome: row.transportadora_nome,
      melhorEnvioServico: row.melhor_envio_servico,
      linkRastreio: row.link_rastreio,
      status: row.status,
      criadoPor: HubAuth.nomeDe(row.criado_por),
      criadoEm: row.criado_em,
      coletadoPor: HubAuth.nomeDe(row.coletado_por),
      coletadoEm: row.coletado_em
    };
  }

  async function loadOrders() {
    const { data, error } = await sb
      .from('pedidos')
      .select('*')
      .eq('data_coleta', currentDate)
      .order('criado_em', { ascending: true })
      .limit(200);
    if (error) { console.error(error); connBanner.hidden = false; return; }
    connBanner.hidden = true;
    lastOrders = (data || []).map(mapRowToOrder);
    render();
  }

  function subscribe() {
    if (channel) { sb.removeChannel(channel); channel = null; }
    loadOrders();
    channel = sb
      .channel('pedidos-' + currentDate)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos', filter: 'data_coleta=eq.' + currentDate }, () => {
        loadOrders();
      })
      .subscribe();
  }

  // ---------------- utilidades de data ----------------

  function formatLocal(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function parseLocal(str) {
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function shiftDate(str, days) {
    const d = parseLocal(str);
    d.setDate(d.getDate() + days);
    return formatLocal(d);
  }
  function shortDate(str) {
    return parseLocal(str).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  }
  function updateDateLabels() {
    const d = parseLocal(currentDate);
    const wd = d.toLocaleDateString('pt-BR', { weekday: 'long' });
    el('weekdayLabel').textContent = wd.charAt(0).toUpperCase() + wd.slice(1);
    el('dateLabel').innerHTML = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + '<span class="yr">/' + d.getFullYear() + '</span>';
    el('isTodayTag').hidden = currentDate !== formatLocal(new Date());
    el('dateJump').value = currentDate;
    el('dataColetaInput').value = currentDate;
  }

  el('prevDay').addEventListener('click', () => setDate(shiftDate(currentDate, -1)));
  el('nextDay').addEventListener('click', () => setDate(shiftDate(currentDate, 1)));
  el('todayBtn').addEventListener('click', () => setDate(formatLocal(new Date())));
  el('dateJump').addEventListener('change', (e) => { if (e.target.value) setDate(e.target.value); });

  function setDate(str) {
    currentDate = str;
    updateDateLabels();
    subscribe();
  }

  function timeOnly(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  // Só aceita links http/https: um "javascript:..." salvo no banco rodaria
  // código no navegador de quem clicasse.
  function safeUrl(value) {
    const v = String(value || '').trim();
    if (!v) return null;
    try {
      const url = new URL(/^[a-z][a-z0-9+.-]*:/i.test(v) ? v : 'https://' + v);
      return (url.protocol === 'https:' || url.protocol === 'http:') ? url.href : null;
    } catch (e) {
      return null;
    }
  }

  // ---------------- rastreio inline ----------------

  async function saveRastreio(id, value) {
    editingRastreioId = null;
    const { error } = await sb.from('pedidos').update({ link_rastreio: value || null }).eq('id', id);
    if (error) { console.error(error); HubUI.toast('Não foi possível salvar o link de rastreio.', { error: true }); }
    await loadOrders();
  }

  function rastreioSegment(order) {
    const showRastreio = order.tipoColeta === 'transportadora' || order.tipoColeta === 'melhor_envio';
    if (!showRastreio) return null;
    const wrap = document.createElement('span');
    wrap.className = 'item rastreio';

    if (editingRastreioId === order.id) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'input rastreio-input';
      input.value = order.linkRastreio || '';
      input.placeholder = 'Cole o link e aperte Enter';
      input.setAttribute('aria-label', 'Link de rastreio');
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveRastreio(order.id, input.value.trim()); }
        if (e.key === 'Escape') { editingRastreioId = null; render(); }
      });
      input.addEventListener('blur', () => saveRastreio(order.id, input.value.trim()));
      wrap.appendChild(input);
      setTimeout(() => input.focus(), 0);
    } else if (safeUrl(order.linkRastreio)) {
      const a = document.createElement('a');
      a.href = safeUrl(order.linkRastreio);
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = ic('external') + '<span>Rastrear pedido</span>';
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'icon-btn';
      editBtn.setAttribute('aria-label', 'Editar link de rastreio');
      editBtn.title = 'Editar link de rastreio';
      editBtn.innerHTML = ic('pencil');
      editBtn.addEventListener('click', () => { editingRastreioId = order.id; render(); });
      wrap.append(a, editBtn);
    } else {
      const addBtnEl = document.createElement('button');
      addBtnEl.type = 'button';
      addBtnEl.className = 'rastreio-add';
      addBtnEl.innerHTML = ic('plus') + '<span>Link de rastreio</span>';
      addBtnEl.addEventListener('click', () => { editingRastreioId = order.id; render(); });
      wrap.appendChild(addBtnEl);
    }
    return wrap;
  }

  function buildDocField(initialTipo, initialValue) {
    let tipo = initialTipo === 'cpf' ? 'cpf' : 'cnpj';
    const uid = 'doc' + Math.random().toString(36).slice(2, 8);
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const lbl = document.createElement('label');
    lbl.textContent = 'CPF ou CNPJ';
    lbl.htmlFor = uid;
    const row = document.createElement('div');
    row.className = 'input-group doc-group';
    const toggle = document.createElement('div');
    toggle.className = 'segmented';
    toggle.setAttribute('role', 'group');
    toggle.setAttribute('aria-label', 'Tipo de documento');
    const btnCnpj = document.createElement('button');
    btnCnpj.type = 'button'; btnCnpj.textContent = 'CNPJ';
    const btnCpf = document.createElement('button');
    btnCpf.type = 'button'; btnCpf.textContent = 'CPF';
    const input = document.createElement('input');
    input.type = 'text';
    input.id = uid;
    input.className = 'input mono';
    input.autocomplete = 'off';
    input.value = initialValue || '';

    function sync() {
      btnCnpj.setAttribute('aria-pressed', tipo === 'cnpj' ? 'true' : 'false');
      btnCpf.setAttribute('aria-pressed', tipo === 'cpf' ? 'true' : 'false');
      input.placeholder = tipo === 'cnpj' ? '00.000.000/0000-00' : '000.000.000-00';
    }
    btnCnpj.addEventListener('click', () => { tipo = 'cnpj'; sync(); });
    btnCpf.addEventListener('click', () => { tipo = 'cpf'; sync(); });
    sync();

    toggle.append(btnCnpj, btnCpf);
    row.append(toggle, input);
    wrap.append(lbl, row);

    return {
      element: wrap,
      getTipo: () => tipo,
      getValue: () => input.value.trim(),
      reset: () => { tipo = 'cnpj'; input.value = ''; sync(); }
    };
  }

  function field(cls, labelText, inputEl) {
    const f = document.createElement('div');
    f.className = 'field ' + cls;
    const lbl = document.createElement('label');
    const uid = 'e' + Math.random().toString(36).slice(2, 8);
    inputEl.id = uid;
    lbl.htmlFor = uid;
    lbl.textContent = labelText;
    f.append(lbl, inputEl);
    return f;
  }

  function mk(tag, cls, type) {
    const n = document.createElement(tag);
    n.className = cls;
    if (type) n.type = type;
    return n;
  }

  function buildEditor(order) {
    const wrap = document.createElement('div');

    const clienteI = mk('input', 'input', 'text'); clienteI.value = order.cliente || '';
    const docFieldE = buildDocField(order.documentoTipo, order.documento || '');
    docFieldE.element.classList.add('f-doc');
    const whatsappI = mk('input', 'input mono', 'tel'); whatsappI.value = order.whatsapp || '';
    const vendedoraSel = mk('select', 'select');
    buildVendedoraOptions(vendedoraSel, order.vendedoraId);
    const dataColetaI = mk('input', 'input', 'date'); dataColetaI.value = order.dataColeta || currentDate;

    const tipoI = mk('select', 'select');
    Object.keys(TIPO_LABELS).forEach((v) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = TIPO_LABELS[v];
      if (v === order.tipoColeta) o.selected = true;
      tipoI.appendChild(o);
    });

    const transpI = mk('input', 'input', 'text'); transpI.value = order.transportadoraNome || '';
    const meI = mk('select', 'select');
    Object.keys(ME_LABELS).forEach((v) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = ME_LABELS[v];
      if (v === order.melhorEnvioServico) o.selected = true;
      meI.appendChild(o);
    });
    const rastreioI = mk('input', 'input mono', 'text'); rastreioI.value = order.linkRastreio || '';

    const pedidoI = mk('input', 'input mono', 'text'); pedidoI.value = order.numeroPedido || '';
    const nfI = mk('input', 'input mono', 'text'); nfI.value = order.nf || '';
    const volI = mk('input', 'input mono', 'number'); volI.min = '1'; volI.step = '1'; volI.value = order.volumes || 1;
    const obsI = mk('textarea', 'textarea'); obsI.rows = 2; obsI.value = order.obs || '';

    const transpField = field('f-transp', 'Transportadora', transpI);
    const meField = field('f-me', 'Serviço do Melhor Envio', meI);
    const rastreioFieldE = field('f-rastreio', 'Link de rastreio', rastreioI);

    function syncEditTipo() {
      const t = tipoI.value;
      transpField.classList.toggle('is-off', t !== 'transportadora');
      meField.classList.toggle('is-off', t !== 'melhor_envio');
      rastreioFieldE.classList.toggle('is-off', t !== 'transportadora' && t !== 'melhor_envio');
    }
    tipoI.addEventListener('change', syncEditTipo);
    syncEditTipo();

    const msg = document.createElement('div');
    msg.className = 'form-error';
    msg.setAttribute('role', 'alert');

    const saveBtn = mk('button', 'btn btn-primary', 'button'); saveBtn.textContent = 'Salvar alterações';
    const cancelBtn = mk('button', 'btn btn-secondary', 'button'); cancelBtn.textContent = 'Cancelar';

    saveBtn.addEventListener('click', async () => {
      msg.textContent = '';
      const cliente = clienteI.value.trim();
      const vendedoraId = vendedoraSel.value;
      const nf = nfI.value.trim();
      const volumes = parseInt(volI.value, 10);
      if (!cliente || !vendedoraId || !nf || !volumes || volumes < 1) {
        msg.textContent = 'Preencha cliente, vendedora, NF e um número de volumes válido.';
        return;
      }
      const tipo = tipoI.value;
      const done = HubUI.busy(saveBtn, 'Salvando…');
      const docValue = docFieldE.getValue();
      const novaData = dataColetaI.value || order.dataColeta;
      const { error } = await sb.from('pedidos').update({
        cliente: cliente,
        documento: docValue || null,
        documento_tipo: docValue ? docFieldE.getTipo() : null,
        whatsapp: whatsappI.value.trim() || null,
        vendedora_id: vendedoraId,
        data_coleta: novaData,
        tipo_coleta: tipo,
        transportadora_nome: tipo === 'transportadora' ? (transpI.value.trim() || null) : null,
        melhor_envio_servico: tipo === 'melhor_envio' ? meI.value : null,
        link_rastreio: (tipo === 'transportadora' || tipo === 'melhor_envio') ? (rastreioI.value.trim() || null) : null,
        numero_pedido: pedidoI.value.trim() || null,
        nf: nf,
        volumes: volumes,
        obs: obsI.value.trim() || null
      }).eq('id', order.id);
      if (error) {
        msg.textContent = 'Não foi possível salvar. Tente novamente.';
        console.error(error);
        done();
        return;
      }
      editingId = null;
      editingRowElement = null;
      HubUI.toast(novaData !== currentDate ? 'Coleta salva e movida para ' + shortDate(novaData) + '.' : 'Alterações salvas.');
      await loadOrders();
    });

    cancelBtn.addEventListener('click', () => {
      editingId = null;
      editingRowElement = null;
      render();
    });

    const grid = document.createElement('div');
    grid.className = 'form-grid';
    grid.append(
      field('f-cliente', 'Cliente', clienteI),
      docFieldE.element,
      field('f-whats', 'WhatsApp do contato', whatsappI),
      field('f-vend', 'Vendedora', vendedoraSel),
      field('f-data', 'Dia da coleta', dataColetaI),
      field('f-tipo', 'Tipo de coleta', tipoI),
      transpField, meField, rastreioFieldE,
      field('f-pedido', 'Nº do pedido', pedidoI),
      field('f-nf', 'NF', nfI),
      field('f-vol', 'Volumes', volI),
      field('f-obs', 'Observações', obsI)
    );

    const actions = document.createElement('div');
    actions.className = 'form-actions';
    actions.style.marginTop = '16px';
    actions.append(saveBtn, cancelBtn, msg);

    wrap.append(grid, actions);
    setTimeout(() => clienteI.focus(), 0);
    return wrap;
  }

  function metaItem(html) {
    const s = document.createElement('span');
    s.className = 'item';
    s.innerHTML = html;
    return s;
  }

  function orderRow(order) {
    const done = order.status === 'coletado';
    const row = document.createElement('div');
    row.className = 'order' + (done ? ' is-done' : '') + (done && order.id === justDoneId ? ' just-done' : '');

    if (editingId === order.id) {
      row.classList.add('is-editing');
      const heading = document.createElement('div');
      heading.className = 'edit-title';
      heading.textContent = 'Editando a coleta de ' + (order.cliente || '');
      row.append(heading, buildEditor(order));
      return row;
    }

    const statusBtn = document.createElement('button');
    statusBtn.className = 'status-btn' + (done ? ' is-done' : '');
    statusBtn.type = 'button';
    const statusLabel = done ? 'Voltar para pendente' : 'Marcar como coletada';
    statusBtn.setAttribute('aria-label', statusLabel + ': ' + order.cliente);
    statusBtn.title = statusLabel;
    if (done) statusBtn.innerHTML = ic('check');
    statusBtn.addEventListener('click', () => toggleStatus(order, statusBtn));

    // ---- bloco principal
    const main = document.createElement('div');
    main.className = 'o-main';

    const title = document.createElement('div');
    title.className = 'o-title';
    const nome = document.createElement('span');
    nome.className = 'o-cliente';
    nome.textContent = order.cliente;
    const tipo = document.createElement('span');
    tipo.className = 'badge badge-outline';
    let extra = '';
    if (order.tipoColeta === 'transportadora' && order.transportadoraNome) {
      extra = ' · ' + escapeHtml(order.transportadoraNome);
    } else if (order.tipoColeta === 'melhor_envio' && order.melhorEnvioServico) {
      extra = ' · ' + escapeHtml(ME_LABELS[order.melhorEnvioServico] || order.melhorEnvioServico);
    }
    tipo.innerHTML = ic(TIPO_ICON[order.tipoColeta] || 'coletas') + '<span>' + escapeHtml(TIPO_LABELS[order.tipoColeta] || order.tipoColeta) + extra + '</span>';
    title.append(nome, tipo);
    main.appendChild(title);

    const meta = document.createElement('div');
    meta.className = 'o-meta';
    if (order.documento) {
      meta.appendChild(metaItem((order.documentoTipo === 'cpf' ? 'CPF' : 'CNPJ') + ' <span class="mono">' + escapeHtml(order.documento) + '</span>'));
    }
    if (order.whatsapp) {
      meta.appendChild(metaItem(ic('whatsapp') + '<span class="mono">' + escapeHtml(order.whatsapp) + '</span>'));
    }
    if (order.vendedora) {
      meta.appendChild(metaItem('Vendedora <strong style="color:var(--text);font-weight:600">' + escapeHtml(order.vendedora) + '</strong>'));
    }
    const rastreio = rastreioSegment(order);
    if (rastreio) meta.appendChild(rastreio);
    meta.appendChild(metaItem(ic('clock') + 'Lançada às ' + timeOnly(order.criadoEm) + (order.criadoPor ? ' por ' + escapeHtml(order.criadoPor) : '')));
    if (done) {
      const by = metaItem(ic('check') + 'Coletada às ' + timeOnly(order.coletadoEm) + (order.coletadoPor ? ' · baixa por ' + escapeHtml(order.coletadoPor) : ''));
      by.classList.add('done-by');
      meta.appendChild(by);
    }
    main.appendChild(meta);

    if (order.obs) {
      const obsBox = document.createElement('div');
      obsBox.className = 'o-obs';
      obsBox.innerHTML = '<b>Obs.</b>' + escapeHtml(order.obs);
      main.appendChild(obsBox);
    }

    // ---- números
    const nums = document.createElement('div');
    nums.className = 'o-nums';
    const num = (k, v) => '<div><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
    nums.innerHTML = (order.numeroPedido ? num('Pedido', escapeHtml(order.numeroPedido)) : '') +
      num('NF', escapeHtml(order.nf)) + num('Volumes', order.volumes);

    // ---- ações
    const actions = document.createElement('div');
    actions.className = 'o-actions';
    const editBtn = mk('button', 'icon-btn', 'button');
    editBtn.innerHTML = ic('pencil');
    editBtn.setAttribute('aria-label', 'Editar coleta de ' + order.cliente);
    editBtn.title = 'Editar';
    editBtn.addEventListener('click', () => {
      editingId = order.id;
      editingRowElement = null;
      pendingDeleteId = null;
      editingRastreioId = null;
      render();
    });

    const confirming = pendingDeleteId === order.id;
    const delBtn = mk('button', 'icon-btn danger' + (confirming ? ' is-confirming' : ''), 'button');
    delBtn.innerHTML = ic('trash') + (confirming ? '<span>Confirmar</span>' : '');
    delBtn.setAttribute('aria-label', confirming ? 'Confirmar exclusão' : 'Excluir coleta de ' + order.cliente);
    delBtn.title = confirming ? 'Clique de novo para excluir' : 'Excluir';
    delBtn.addEventListener('click', () => requestDelete(order.id));
    actions.append(editBtn, delBtn);

    row.append(statusBtn, main, nums, actions);
    return row;
  }

  function rowForOrder(order) {
    if (editingId === order.id && editingRowElement) return editingRowElement;
    const rowEl = orderRow(order);
    if (editingId === order.id) editingRowElement = rowEl;
    return rowEl;
  }

  function emptyState(title, text) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.innerHTML = ic('coletas') + '<div class="empty-title"></div><div class="empty-text"></div>';
    d.querySelector('.empty-title').textContent = title;
    d.querySelector('.empty-text').textContent = text;
    return d;
  }

  function render() {
    const pending = lastOrders.filter((o) => o.status === 'pendente');
    const collected = lastOrders.filter((o) => o.status === 'coletado');

    el('pendingCount').textContent = pending.length;
    el('collectedCount').textContent = collected.length;

    if (editingId && !lastOrders.some((o) => o.id === editingId)) {
      editingId = null;
      editingRowElement = null;
    }

    const pendingList = el('pendingList');
    pendingList.innerHTML = '';
    if (pending.length === 0) {
      pendingList.appendChild(collected.length
        ? emptyState('Nada pendente neste dia', 'Todas as coletas já receberam baixa.')
        : emptyState('Nenhuma coleta pendente', 'Use o formulário acima para lançar uma retirada neste dia.'));
    } else {
      pending.forEach((o) => pendingList.appendChild(rowForOrder(o)));
    }

    const collectedList = el('collectedList');
    collectedList.innerHTML = '';
    if (collected.length === 0) {
      collectedList.appendChild(emptyState('Nenhuma coleta finalizada ainda', 'Quando alguém der baixa, a coleta aparece aqui com o horário e quem fez.'));
    } else {
      collected.forEach((o) => collectedList.appendChild(rowForOrder(o)));
    }
  }

  async function toggleStatus(order, btn) {
    if (btn) btn.setAttribute('aria-busy', 'true');
    const payload = order.status === 'pendente'
      ? { status: 'coletado', coletado_por: currentUser.id, coletado_em: new Date().toISOString() }
      : { status: 'pendente', coletado_por: null, coletado_em: null };
    const { error } = await sb.from('pedidos').update(payload).eq('id', order.id);
    if (!error && order.status === 'pendente') {
      justDoneId = order.id;
      setTimeout(() => { if (justDoneId === order.id) justDoneId = null; }, 1000);
    }
    if (error) { console.error(error); HubUI.toast('Não foi possível atualizar a coleta. Tente de novo.', { error: true }); }
    else HubUI.toast(order.status === 'pendente' ? order.cliente + ' marcada como coletada.' : order.cliente + ' voltou para pendente.');
    await loadOrders();
  }

  async function requestDelete(id) {
    if (pendingDeleteId === id) {
      clearTimeout(pendingDeleteTimeout);
      pendingDeleteId = null;
      const { error } = await sb.from('pedidos').delete().eq('id', id);
      if (error) { console.error(error); HubUI.toast('Não foi possível excluir. Tente de novo.', { error: true }); }
      else HubUI.toast('Coleta excluída.');
      await loadOrders();
      return;
    }
    pendingDeleteId = id;
    render();
    pendingDeleteTimeout = setTimeout(() => {
      pendingDeleteId = null;
      render();
    }, 3000);
  }

  entryForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    formMsg.textContent = '';
    ['clienteInput', 'nfInput', 'volInput'].forEach((id) => el(id).removeAttribute('aria-invalid'));

    const cliente = el('clienteInput').value.trim();
    const documento = docField.getValue();
    const documentoTipo = docField.getTipo();
    const whatsapp = el('whatsappInput').value.trim();
    const vendedoraId = el('vendedoraInput').value;
    const dataColeta = el('dataColetaInput').value || currentDate;
    const numeroPedido = el('pedidoInput').value.trim();
    const nf = el('nfInput').value.trim();
    const volumes = parseInt(el('volInput').value, 10);
    const obs = el('obsInput').value.trim();
    const tipo = tipoInput.value;
    const transportadoraNome = tipo === 'transportadora' ? transportadoraInput.value.trim() : '';
    const melhorEnvioServico = tipo === 'melhor_envio' ? melhorEnvioInput.value : '';
    const linkRastreio = (tipo === 'transportadora' || tipo === 'melhor_envio') ? rastreioInput.value.trim() : '';

    if (!cliente || !vendedoraId || !nf || !volumes || volumes < 1) {
      if (!cliente) el('clienteInput').setAttribute('aria-invalid', 'true');
      if (!nf) el('nfInput').setAttribute('aria-invalid', 'true');
      if (!volumes || volumes < 1) el('volInput').setAttribute('aria-invalid', 'true');
      formMsg.textContent = 'Preencha cliente, vendedora, NF e um número de volumes válido.';
      (el('clienteInput').getAttribute('aria-invalid') ? el('clienteInput') : el('nfInput')).focus();
      return;
    }

    const done = HubUI.busy(addBtn, 'Adicionando…');
    const { error } = await sb.from('pedidos').insert({
      data_coleta: dataColeta,
      cliente: cliente,
      documento: documento || null,
      documento_tipo: documento ? documentoTipo : null,
      whatsapp: whatsapp || null,
      vendedora_id: vendedoraId,
      numero_pedido: numeroPedido || null,
      nf: nf,
      volumes: volumes,
      obs: obs || null,
      tipo_coleta: tipo,
      transportadora_nome: transportadoraNome || null,
      melhor_envio_servico: melhorEnvioServico || null,
      link_rastreio: linkRastreio || null
    });
    done();

    if (error) {
      formMsg.textContent = 'Não foi possível salvar. Tente novamente.';
      console.error(error);
      return;
    }
    HubUI.toast(dataColeta === currentDate ? 'Coleta adicionada.' : 'Coleta adicionada para ' + shortDate(dataColeta) + '.');
    entryForm.reset();
    el('volInput').value = 1;
    el('dataColetaInput').value = currentDate;
    docField.reset();
    syncTipoFields();
    buildVendedoraOptions(el('vendedoraInput'), currentUser.id);
    el('clienteInput').focus();
    await loadOrders();
  });
})();
</script>
</body>
</html>
