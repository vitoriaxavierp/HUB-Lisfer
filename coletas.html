<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coletas — Hub Lisfer</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #F1F4F6;
    --surface-3: #EAEFF2;
    --border: #D7DEE3;
    --text: #16232D;
    --text-muted: #5B6B77;
    --accent: #16191C;
    --accent-strong: #000000;
    --accent-contrast: #FFFFFF;
    --title-accent: #F5AD00;
    --pending: #F5AD00;
    --pending-bg: #FFF1D6;
    --collected: #1E8E3E;
    --collected-bg: #E1F3E4;
    --danger: #D32F2F;
    --danger-bg: #FBE1E1;
    --focus: #16191C;
    --shadow: 0 1px 3px rgba(20, 34, 43, 0.08), 0 6px 18px rgba(20, 34, 43, 0.09);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 16.5px;
    line-height: 1.45;
    min-height: 100vh;
  }

  h1, h2 {
    font-family: "Archivo", system-ui, sans-serif;
    text-wrap: balance;
    margin: 0;
  }

  button { font-family: inherit; cursor: pointer; }
  input, select, textarea, button { font-size: 14px; }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .tabular { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  a { color: inherit; }

  /* ---------- header ---------- */

  .topbar {
    background: linear-gradient(180deg, var(--accent-strong), var(--accent));
    color: var(--accent-contrast);
    padding: 18px 20px;
  }

  .topbar-inner {
    max-width: 1040px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 18px 28px;
  }

  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }

  .brand-mark {
    flex: none; width: 38px; height: 38px;
    display: grid; place-items: center;
    background: rgba(244, 249, 251, 0.14);
    border: 1px solid rgba(244, 249, 251, 0.28);
    border-radius: 10px;
  }

  .back-link {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: rgba(244, 249, 251, 0.72); text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
    margin-bottom: 4px;
  }
  .back-link:hover { color: #FFFFFF; }
  .back-link svg { width: 12px; height: 12px; }

  .brand h1 { font-size: 23px; font-weight: 800; letter-spacing: 0.2px; color: var(--title-accent); }
  .brand p { margin: 2px 0 0; font-size: 13.5px; color: #FFFFFF; }

  .date-nav { display: flex; align-items: center; gap: 8px; }

  .date-nav button.step {
    width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid rgba(244, 249, 251, 0.3);
    background: rgba(244, 249, 251, 0.08);
    color: var(--accent-contrast);
    font-size: 16px; line-height: 1;
    display: grid; place-items: center;
  }
  .date-nav button.step:hover { background: rgba(244, 249, 251, 0.2); }

  .date-display {
    display: flex; flex-direction: column; align-items: center;
    min-width: 122px; padding: 0 4px;
  }
  .date-display .weekday {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em;
    color: rgba(244, 249, 251, 0.68);
  }
  .date-display .big { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 21px; }

  .date-jump-wrap { position: relative; display: flex; }
  .date-jump { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: 0; cursor: pointer; }
  .jump-btn {
    width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid rgba(244, 249, 251, 0.3);
    background: rgba(244, 249, 251, 0.08);
    color: var(--accent-contrast);
    display: grid; place-items: center;
  }

  .today-btn {
    border: 1px solid rgba(244, 249, 251, 0.3);
    background: rgba(244, 249, 251, 0.1);
    color: var(--accent-contrast);
    border-radius: 999px; padding: 8px 16px;
    font-weight: 600; font-size: 13px;
  }
  .today-btn:hover { background: rgba(244, 249, 251, 0.22); }

  .user-info { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #FFFFFF; font-weight: 600; white-space: nowrap; }

  /* ---------- content ---------- */

  main {
    max-width: 1040px; margin: 0 auto; padding: 22px 20px 60px;
    display: flex; flex-direction: column; gap: 22px;
  }

  .conn-banner {
    border: 1px solid var(--danger); background: var(--danger-bg); color: var(--danger);
    border-radius: 10px; padding: 12px 14px; font-size: 13.5px; display: none;
  }
  .conn-banner.show { display: block; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }

  form.entry { padding: 18px; display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: end; }

  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 160px; }
  .field.cliente { flex: 2 1 220px; }
  .field.documento { flex: 1.3 1 220px; }
  .field.whatsapp { flex: 1 1 160px; }
  .field.vendedora { flex: 1 1 160px; }
  .field.tipo { flex: 1.1 1 170px; }
  .field.transportadora { flex: 1.2 1 190px; }
  .field.melhorenvio { flex: 1.3 1 220px; }
  .field.rastreio { flex: 1.5 1 220px; }
  .field.pedido { flex: 0.8 1 110px; }
  .field.nf { flex: 0.8 1 110px; }
  .field.vol { flex: 0.55 1 90px; }
  .field.obs { flex-basis: 100%; }
  .field.hidden { display: none; }

  .field label {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-muted); font-weight: 600;
  }
  .field input, .field select, .field textarea {
    background: var(--surface-2); border: 1.5px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 11px 12px; width: 100%; font-size: 15px;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
  }
  .field textarea { resize: vertical; min-height: 44px; line-height: 1.4; }
  .field input:focus, .field select:focus, .field textarea:focus { background: var(--bg); border-color: var(--accent); }
  .field input:disabled, .field select:disabled, .field textarea:disabled { opacity: 0.55; }
  .field.nf input, .field.vol input, .field.whatsapp input, .field.documento input, .field.rastreio input, .field.pedido input {
    font-family: "IBM Plex Mono", monospace;
  }

  .doc-row { display: flex; gap: 8px; }
  .doc-toggle {
    display: flex; flex: none; border: 1.5px solid var(--border);
    border-radius: 9px; overflow: hidden;
  }
  .doc-opt {
    padding: 0 13px; background: var(--surface-2); color: var(--text-muted);
    font-weight: 700; font-size: 12.5px; border: none; border-right: 1px solid var(--border);
  }
  .doc-opt:last-child { border-right: none; }
  .doc-opt.active { background: var(--accent); color: var(--accent-contrast); }
  .doc-row input { flex: 1 1 auto; min-width: 0; }

  .add-btn {
    background: var(--accent); color: var(--accent-contrast); border: none; border-radius: 999px;
    padding: 12px 24px; font-weight: 700; font-size: 15px; white-space: nowrap; height: 46px; flex: none;
  }
  .add-btn:hover { background: var(--accent-strong); }
  .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .form-msg { flex-basis: 100%; font-size: 13px; font-weight: 600; color: var(--danger); min-height: 0; }

  /* ---------- sections ---------- */

  .section-head { display: flex; align-items: center; gap: 10px; padding: 2px 2px 0; }
  .section-head .dot { width: 13px; height: 13px; border-radius: 50%; flex: none; }
  .section-head.pending .dot { background: var(--pending); }
  .section-head.collected .dot { background: var(--collected); }
  .section-head h2 { font-size: 18px; font-weight: 800; }
  .section-head .count {
    font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 13px;
    padding: 2px 9px; border-radius: 999px;
  }
  .section-head.pending .count { color: #8A5B00; background: var(--pending-bg); }
  .section-head.collected .count { color: var(--collected); background: var(--collected-bg); }

  .order-list { display: flex; flex-direction: column; gap: 10px; }

  /* ---------- order card ---------- */

  .order-row { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 12px; }
  .order-row.pendente {
    background: var(--pending-bg); border: 1px solid var(--border);
    border-left-width: 5px; border-left-color: var(--pending);
    box-shadow: var(--shadow);
  }
  .order-row.coletado {
    background: var(--collected-bg); border: 1px solid var(--border);
    border-left-width: 5px; border-left-color: var(--collected);
    opacity: 0.88;
  }

  .row-top { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }

  .status-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none;
    display: grid; place-items: center; flex: none;
  }
  .status-btn.pendente { background: var(--pending-bg); box-shadow: inset 0 0 0 3px var(--pending); }
  .status-btn.pendente::after { content: ""; width: 16px; height: 16px; border-radius: 50%; background: var(--pending); }
  .status-btn.coletado { background: var(--collected); }
  .status-btn.coletado svg { width: 19px; height: 19px; stroke: var(--accent-contrast); }

  .cliente-cell { flex: 1 1 220px; min-width: 0; }
  .nome-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cliente-cell .nome {
    font-weight: 700; font-size: 16.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1 1 auto; min-width: 70px;
  }
  .order-row.coletado .cliente-cell .nome {
    text-decoration: line-through; text-decoration-color: var(--collected); text-decoration-thickness: 1.5px;
  }

  .tipo-badge {
    display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap;
    background: var(--accent); color: var(--accent-contrast);
    border-radius: 999px; padding: 5px 12px 5px 10px;
    font-size: 13px; font-weight: 700; line-height: 1.2;
  }
  .tipo-badge svg { width: 15px; height: 15px; flex: none; }
  .tipo-badge .extra { color: rgba(255, 255, 255, 0.82); font-weight: 600; }

  .contato-line, .doc-line {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 3px; font-size: 12.5px; font-family: "IBM Plex Mono", monospace;
  }
  .contato-line { color: var(--accent); }
  .doc-line { color: var(--text-muted); }
  .contato-line svg { width: 13px; height: 13px; flex: none; }

  .row-actions { display: flex; align-items: center; gap: 16px; flex: none; margin-left: auto; }

  .pedido-cell, .nf-cell, .vol-cell { font-family: "IBM Plex Mono", monospace; font-size: 14.5px; white-space: nowrap; }
  .pedido-cell .v, .nf-cell .v, .vol-cell .v { color: var(--text); font-weight: 600; }
  .pedido-cell .k, .nf-cell .k, .vol-cell .k { color: var(--text-muted); font-size: 11.5px; margin-right: 4px; }

  .del-btn {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: var(--text-muted); display: grid; place-items: center; flex: none;
  }
  .del-btn:hover { background: var(--surface-2); color: var(--danger); }
  .del-btn.confirming { background: var(--danger); color: var(--accent-contrast); }
  .del-btn svg { width: 16px; height: 16px; }

  .edit-btn {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: var(--text-muted); display: grid; place-items: center; flex: none;
  }
  .edit-btn:hover { background: var(--surface-2); color: var(--accent); }
  .edit-btn svg { width: 16px; height: 16px; }

  .edit-heading {
    font-weight: 700; font-size: 13.5px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em; padding: 0 0 2px;
  }
  .entry.edit-form { padding: 0; }
  .edit-actions { display: flex; gap: 10px; flex-basis: 100%; }
  .cancel-btn {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 12px 24px; font-weight: 700; font-size: 15px; height: 46px;
  }
  .cancel-btn:hover { background: var(--surface-3); }

  .row-meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding-left: 52px; font-size: 12.5px; color: var(--text-muted);
  }

  .vendedora-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); color: var(--text);
    border-radius: 999px; padding: 3px 10px; font-weight: 600; font-size: 12px;
  }
  .vendedora-chip .lbl {
    color: var(--text-muted); font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.05em; font-size: 10px;
  }

  .rastreio-chip { display: inline-flex; align-items: center; gap: 6px; }
  .rastreio-link {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--accent); font-weight: 600; text-decoration: underline; font-size: 12.5px;
  }
  .rastreio-link:hover { text-decoration: none; }
  .rastreio-link svg { width: 13px; height: 13px; }
  .rastreio-edit {
    width: 22px; height: 22px; border-radius: 6px; border: none;
    background: transparent; color: var(--text-muted); display: grid; place-items: center;
  }
  .rastreio-edit:hover { background: var(--surface-2); color: var(--accent); }
  .rastreio-edit svg { width: 12px; height: 12px; }
  .rastreio-add {
    border: 1px dashed var(--border); background: transparent; color: var(--accent);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600;
  }
  .rastreio-add:hover { background: var(--surface-2); border-color: var(--accent); }
  .rastreio-input {
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
    border: 1.5px solid var(--accent); border-radius: 6px; padding: 4px 8px;
    min-width: 220px; background: var(--bg); color: var(--text);
  }

  .row-obs {
    margin-left: 52px; background: var(--surface-3); border-radius: 9px;
    padding: 9px 12px; font-size: 13px; color: var(--text); line-height: 1.45;
  }
  .row-obs .lbl {
    font-weight: 700; color: var(--text-muted); text-transform: uppercase;
    font-size: 10.5px; letter-spacing: 0.06em; margin-right: 6px;
  }

  .empty-state { padding: 22px 14px; text-align: center; color: var(--text-muted); font-size: 13.5px; }

  footer.note { text-align: center; color: var(--text-muted); font-size: 11.5px; padding-bottom: 10px; }

  @media (max-width: 720px) {
    .topbar-inner { justify-content: center; }
    .brand { margin-right: 0; width: 100%; justify-content: center; }
    .add-btn { width: 100%; }
    .row-actions { margin-left: 0; flex-basis: 100%; padding-left: 52px; }
    .row-meta, .row-obs { padding-left: 0; margin-left: 0; }
  }
</style>
</head>
<body>

<div id="appScreen" hidden>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <img src="favicon.png" alt="" style="width:22px;height:22px;">
        </span>
        <div>
          <a class="back-link" href="index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Hub Lisfer
          </a>
          <h1>Painel de Coletas</h1>
          <p>Retiradas do dia, compartilhado com a equipe</p>
        </div>
      </div>

      <div class="date-nav">
        <button class="step" id="prevDay" aria-label="Dia anterior">‹</button>
        <div class="date-display">
          <span class="weekday" id="weekdayLabel">—</span>
          <span class="big tabular" id="dateLabel">--/--</span>
        </div>
        <button class="step" id="nextDay" aria-label="Próximo dia">›</button>
        <div class="date-jump-wrap">
          <span class="jump-btn" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </span>
          <input type="date" class="date-jump" id="dateJump" aria-label="Ir para data">
        </div>
        <button class="today-btn" id="todayBtn">Hoje</button>
      </div>

      <div class="user-info">
        <span id="userGreeting">—</span>
        <button type="button" id="logoutBtn" class="today-btn">Sair</button>
      </div>
    </div>
  </div>

  <main>
    <div class="conn-banner" id="connBanner">
      Não foi possível carregar os pedidos. Verifique sua conexão e recarregue a página.
    </div>

    <div class="panel">
      <form class="entry" id="entryForm">
        <div class="field cliente">
          <label for="clienteInput">Cliente</label>
          <input type="text" id="clienteInput" placeholder="Nome do cliente" autocomplete="off" required>
        </div>
        <div id="docFieldSlot"></div>
        <div class="field whatsapp">
          <label for="whatsappInput">WhatsApp do contato</label>
          <input type="tel" id="whatsappInput" placeholder="(11) 91234-5678" autocomplete="off">
        </div>
        <div class="field vendedora">
          <label for="vendedoraInput">Vendedora</label>
          <select id="vendedoraInput" required></select>
        </div>

        <div class="field tipo">
          <label for="tipoInput">Tipo de coleta</label>
          <select id="tipoInput">
            <option value="transportadora">Transportadora</option>
            <option value="uber">Uber</option>
            <option value="retirada">Retirada pessoal</option>
            <option value="melhor_envio">Melhor Envio</option>
          </select>
        </div>
        <div class="field transportadora hidden" id="transportadoraField">
          <label for="transportadoraInput">Qual transportadora</label>
          <input type="text" id="transportadoraInput" placeholder="ex: Jamef, Braspress" autocomplete="off">
        </div>
        <div class="field melhorenvio hidden" id="melhorEnvioField">
          <label for="melhorEnvioInput">Serviço do Melhor Envio</label>
          <select id="melhorEnvioInput">
            <option value="jadlog_com">Jadlog .com</option>
            <option value="jadlog_package">Jadlog .package</option>
            <option value="jadlog_package_centralizado">Jadlog .package centralizado</option>
            <option value="correios">Correios</option>
          </select>
        </div>
        <div class="field rastreio hidden" id="rastreioField">
          <label for="rastreioInput">Link de rastreio</label>
          <input type="text" id="rastreioInput" placeholder="cole o link de rastreio (se já tiver)" autocomplete="off">
        </div>

        <div class="field pedido">
          <label for="pedidoInput">Nº do pedido</label>
          <input type="text" id="pedidoInput" placeholder="ex: 1029" autocomplete="off">
        </div>
        <div class="field nf">
          <label for="nfInput">NF</label>
          <input type="text" id="nfInput" placeholder="nº" autocomplete="off" required>
        </div>
        <div class="field vol">
          <label for="volInput">Volumes</label>
          <input type="number" id="volInput" min="1" step="1" value="1" required>
        </div>

        <div class="field obs">
          <label for="obsInput">Observações (o que tem no pedido)</label>
          <textarea id="obsInput" rows="2" placeholder="ex: 5 LF-0303, 2 LX-0178"></textarea>
        </div>

        <button type="submit" class="add-btn" id="addBtn">Adicionar</button>
        <div class="form-msg" id="formMsg"></div>
      </form>
    </div>

    <div>
      <div class="section-head pending">
        <span class="dot"></span>
        <h2>Pendentes</h2>
        <span class="count tabular" id="pendingCount">0</span>
      </div>
      <div class="order-list" id="pendingList" style="margin-top:10px;"></div>
    </div>

    <div>
      <div class="section-head collected">
        <span class="dot"></span>
        <h2>Coletados</h2>
        <span class="count tabular" id="collectedCount">0</span>
      </div>
      <div class="order-list" id="collectedList" style="margin-top:10px;"></div>
    </div>

    <footer class="note">Atualiza automaticamente para todas as pessoas com o painel aberto.</footer>
  </main>
</div>

<script>
(function () {
  const ICONS = {
    transportadora: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="13" height="10"/><path d="M14 9h4l4 4v3h-8z"/><circle cx="6" cy="18" r="1.8"/><circle cx="17.5" cy="18" r="1.8"/></svg>',
    uber: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-5a2 2 0 0 1 2-1.3h10a2 2 0 0 1 2 1.3l2 5"/><rect x="2" y="13" width="20" height="6" rx="1.5"/><circle cx="7" cy="19.5" r="1.6"/><circle cx="17" cy="19.5" r="1.6"/></svg>',
    retirada: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><path d="M12 8v6M8 10l4-2 4 2M8 21l4-7 4 7"/></svg>',

  const TRACK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>';

  let currentUser = null;
  let channel = null;
  let currentDate = formatLocal(new Date());
  let lastOrders = [];
  let pendingDeleteId = null;
  let pendingDeleteTimeout = null;
  let editingRastreioId = null;
  let editingId = null;
  let editingRowElement = null;

  const el = (id) => document.getElementById(id);
  const connBanner = el('connBanner');
  const entryForm = el('entryForm');
  const addBtn = el('addBtn');
  const formMsg = el('formMsg');

  const docField = buildDocField('cnpj', '');
  el('docFieldSlot').replaceWith(docField.element);

  const tipoInput = el('tipoInput');
  const transportadoraField = el('transportadoraField');
  const transportadoraInput = el('transportadoraInput');
  const melhorEnvioField = el('melhorEnvioField');
  const melhorEnvioInput = el('melhorEnvioInput');
  const rastreioField = el('rastreioField');
  const rastreioInput = el('rastreioInput');

  function syncTipoFields() {
    const tipo = tipoInput.value;
    transportadoraField.classList.toggle('hidden', tipo !== 'transportadora');
    melhorEnvioField.classList.toggle('hidden', tipo !== 'melhor_envio');
    rastreioField.classList.toggle('hidden', tipo !== 'transportadora' && tipo !== 'melhor_envio');
  }
  tipoInput.addEventListener('change', syncTipoFields);
  syncTipoFields();

  el('logoutBtn').addEventListener('click', () => HubAuth.logout());

  function buildVendedoraOptions(selectEl, selectedId) {
    selectEl.innerHTML = '';
    HubAuth.profiles.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.nome || p.id;
      if (p.id === selectedId) o.selected = true;
      selectEl.appendChild(o);
    });
  }

  HubAuth.requireAuth((user) => {
    currentUser = user;
    el('userGreeting').textContent = 'Olá, ' + (HubAuth.nomeDe(user.id) || user.email);
    buildVendedoraOptions(el('vendedoraInput'), user.id);
    el('appScreen').hidden = false;
    updateDateLabels();
    subscribe();
  });

  // ---------------- data (Supabase) ----------------

  function mapRowToOrder(row) {
    return {
      id: row.id,
      dataColeta: row.data_coleta,
      cliente: row.cliente,
      documento: row.documento,
      documentoTipo: row.documento_tipo,
      whatsapp: row.whatsapp,
      vendedoraId: row.vendedora_id,
      vendedora: HubAuth.nomeDe(row.vendedora_id),
      numeroPedido: row.numero_pedido,
      nf: row.nf,
      volumes: row.volumes,
      obs: row.obs,
      tipoColeta: row.tipo_coleta,
      transportadoraNome: row.transportadora_nome,
      melhorEnvioServico: row.melhor_envio_servico,
      linkRastreio: row.link_rastreio,
      status: row.status,
      criadoPor: HubAuth.nomeDe(row.criado_por),
      criadoEm: row.criado_em,
      coletadoPor: HubAuth.nomeDe(row.coletado_por),
      coletadoEm: row.coletado_em
    };
  }

  async function loadOrders() {
    const { data, error } = await sb
      .from('pedidos')
      .select('*')
      .eq('data_coleta', currentDate)
      .order('criado_em', { ascending: true })
      .limit(200);
    if (error) { console.error(error); connBanner.classList.add('show'); return; }
    connBanner.classList.remove('show');
    lastOrders = (data || []).map(mapRowToOrder);
    render();
  }

  function subscribe() {
    if (channel) { sb.removeChannel(channel); channel = null; }
    loadOrders();
    channel = sb
      .channel('pedidos-' + currentDate)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos', filter: 'data_coleta=eq.' + currentDate }, () => {
        loadOrders();
      })
      .subscribe();
  }

  // ---------------- utilidades de data ----------------

  function formatLocal(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function parseLocal(str) {
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function shiftDate(str, days) {
    const d = parseLocal(str);
    d.setDate(d.getDate() + days);
    return formatLocal(d);
  }
  function updateDateLabels() {
    const d = parseLocal(currentDate);
    el('weekdayLabel').textContent = d.toLocaleDateString('pt-BR', { weekday: 'long' });
    el('dateLabel').textContent = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    el('dateJump').value = currentDate;
  }

  el('prevDay').addEventListener('click', () => setDate(shiftDate(currentDate, -1)));
  el('nextDay').addEventListener('click', () => setDate(shiftDate(currentDate, 1)));
  el('todayBtn').addEventListener('click', () => setDate(formatLocal(new Date())));
  el('dateJump').addEventListener('change', (e) => { if (e.target.value) setDate(e.target.value); });

  function setDate(str) {
    currentDate = str;
    updateDateLabels();
    subscribe();
  }

  function timeOnly(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---------------- rastreio inline ----------------

  async function saveRastreio(id, value) {
    editingRastreioId = null;
    const { error } = await sb.from('pedidos').update({ link_rastreio: value || null }).eq('id', id);
    if (error) console.error(error);
    await loadOrders();
  }

  function rastreioSegment(order) {
    const showRastreio = order.tipoColeta === 'transportadora' || order.tipoColeta === 'melhor_envio';
    if (!showRastreio) return null;
    const wrap = document.createElement('span');
    wrap.className = 'rastreio-chip';

    if (editingRastreioId === order.id) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'rastreio-input';
      input.value = order.linkRastreio || '';
      input.placeholder = 'Colar link de rastreio';
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveRastreio(order.id, input.value.trim()); }
        if (e.key === 'Escape') { editingRastreioId = null; render(); }
      });
      input.addEventListener('blur', () => saveRastreio(order.id, input.value.trim()));
      wrap.appendChild(input);
      setTimeout(() => input.focus(), 0);
    } else if (order.linkRastreio) {
      const a = document.createElement('a');
      a.href = order.linkRastreio;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'rastreio-link';
      a.innerHTML = TRACK_SVG + '<span>Rastrear pedido</span>';
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'rastreio-edit';
      editBtn.setAttribute('aria-label', 'Editar link de rastreio');
      editBtn.innerHTML = PENCIL_SVG;
      editBtn.addEventListener('click', () => { editingRastreioId = order.id; render(); });
      wrap.append(a, editBtn);
    } else {
      const addBtnEl = document.createElement('button');
      addBtnEl.type = 'button';
      addBtnEl.className = 'rastreio-add';
      addBtnEl.textContent = '+ Link de rastreio';
      addBtnEl.addEventListener('click', () => { editingRastreioId = order.id; render(); });
      wrap.appendChild(addBtnEl);
    }
    return wrap;
  }

  function buildDocField(initialTipo, initialValue) {
    let tipo = initialTipo === 'cpf' ? 'cpf' : 'cnpj';
    const wrap = document.createElement('div');
    wrap.className = 'field documento';
    const lbl = document.createElement('label');
    lbl.textContent = 'CPF ou CNPJ';
    const row = document.createElement('div');
    row.className = 'doc-row';
    const toggle = document.createElement('div');
    toggle.className = 'doc-toggle';
    toggle.setAttribute('role', 'group');
    toggle.setAttribute('aria-label', 'Tipo de documento');
    const btnCnpj = document.createElement('button');
    btnCnpj.type = 'button'; btnCnpj.textContent = 'CNPJ'; btnCnpj.className = 'doc-opt';
    const btnCpf = document.createElement('button');
    btnCpf.type = 'button'; btnCpf.textContent = 'CPF'; btnCpf.className = 'doc-opt';
    const input = document.createElement('input');
    input.type = 'text';
    input.autocomplete = 'off';
    input.value = initialValue || '';

    function sync() {
      btnCnpj.classList.toggle('active', tipo === 'cnpj');
      btnCpf.classList.toggle('active', tipo === 'cpf');
      input.placeholder = tipo === 'cnpj' ? '00.000.000/0000-00' : '000.000.000-00';
    }
    btnCnpj.addEventListener('click', () => { tipo = 'cnpj'; sync(); });
    btnCpf.addEventListener('click', () => { tipo = 'cpf'; sync(); });
    sync();

    toggle.append(btnCnpj, btnCpf);
    row.append(toggle, input);
    wrap.append(lbl, row);

    return {
      element: wrap,
      getTipo: () => tipo,
      getValue: () => input.value.trim(),
      reset: () => { tipo = 'cnpj'; input.value = ''; sync(); }
    };
  }

  function field(cls, labelText, inputEl) {
    const f = document.createElement('div');
    f.className = 'field ' + cls;
    const lbl = document.createElement('label');
    lbl.textContent = labelText;
    f.append(lbl, inputEl);
    return f;
  }

  function buildEditor(order) {
    const wrap = document.createElement('div');
    wrap.className = 'entry edit-form';

    const clienteI = document.createElement('input'); clienteI.type = 'text'; clienteI.value = order.cliente || '';
    const docFieldE = buildDocField(order.documentoTipo, order.documento || '');
    const whatsappI = document.createElement('input'); whatsappI.type = 'tel'; whatsappI.value = order.whatsapp || '';
    const vendedoraSel = document.createElement('select');
    buildVendedoraOptions(vendedoraSel, order.vendedoraId);

    const tipoI = document.createElement('select');
    Object.keys(TIPO_LABELS).forEach((v) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = TIPO_LABELS[v];
      if (v === order.tipoColeta) o.selected = true;
      tipoI.appendChild(o);
    });

    const transpI = document.createElement('input'); transpI.type = 'text'; transpI.value = order.transportadoraNome || '';
    const meI = document.createElement('select');
    Object.keys(ME_LABELS).forEach((v) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = ME_LABELS[v];
      if (v === order.melhorEnvioServico) o.selected = true;
      meI.appendChild(o);
    });
    const rastreioI = document.createElement('input'); rastreioI.type = 'text'; rastreioI.value = order.linkRastreio || '';

    const pedidoI = document.createElement('input'); pedidoI.type = 'text'; pedidoI.value = order.numeroPedido || '';
    const nfI = document.createElement('input'); nfI.type = 'text'; nfI.value = order.nf || '';
    const volI = document.createElement('input'); volI.type = 'number'; volI.min = '1'; volI.step = '1'; volI.value = order.volumes || 1;
    const obsI = document.createElement('textarea'); obsI.rows = 2; obsI.value = order.obs || '';

    const transpField = field('transportadora', 'Qual transportadora', transpI);
    const meField = field('melhorenvio', 'Serviço do Melhor Envio', meI);
    const rastreioFieldE = field('rastreio', 'Link de rastreio', rastreioI);

    function syncEditTipo() {
      const t = tipoI.value;
      transpField.classList.toggle('hidden', t !== 'transportadora');
      meField.classList.toggle('hidden', t !== 'melhor_envio');
      rastreioFieldE.classList.toggle('hidden', t !== 'transportadora' && t !== 'melhor_envio');
    }
    tipoI.addEventListener('change', syncEditTipo);
    syncEditTipo();

    const msg = document.createElement('div');
    msg.className = 'form-msg';

    const saveBtn = document.createElement('button');
    saveBtn.type = 'button'; saveBtn.className = 'add-btn'; saveBtn.textContent = 'Salvar';
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button'; cancelBtn.className = 'cancel-btn'; cancelBtn.textContent = 'Cancelar';

    saveBtn.addEventListener('click', async () => {
      msg.textContent = '';
      const cliente = clienteI.value.trim();
      const vendedoraId = vendedoraSel.value;
      const nf = nfI.value.trim();
      const volumes = parseInt(volI.value, 10);
      if (!cliente || !vendedoraId || !nf || !volumes || volumes < 1) {
        msg.textContent = 'Preencha cliente, vendedora, NF e um número de volumes válido.';
        return;
      }
      const tipo = tipoI.value;
      saveBtn.disabled = true;
      const docValue = docFieldE.getValue();
      const { error } = await sb.from('pedidos').update({
        cliente: cliente,
        documento: docValue || null,
        documento_tipo: docValue ? docFieldE.getTipo() : null,
        whatsapp: whatsappI.value.trim() || null,
        vendedora_id: vendedoraId,
        tipo_coleta: tipo,
        transportadora_nome: tipo === 'transportadora' ? (transpI.value.trim() || null) : null,
        melhor_envio_servico: tipo === 'melhor_envio' ? meI.value : null,
        link_rastreio: (tipo === 'transportadora' || tipo === 'melhor_envio') ? (rastreioI.value.trim() || null) : null,
        numero_pedido: pedidoI.value.trim() || null,
        nf: nf,
        volumes: volumes,
        obs: obsI.value.trim() || null
      }).eq('id', order.id);
      if (error) {
        msg.textContent = 'Não foi possível salvar. Tente novamente.';
        console.error(error);
        saveBtn.disabled = false;
        return;
      }
      editingId = null;
      editingRowElement = null;
      await loadOrders();
    });

    cancelBtn.addEventListener('click', () => {
      editingId = null;
      editingRowElement = null;
      render();
    });

    const actions = document.createElement('div');
    actions.className = 'edit-actions';
    actions.append(saveBtn, cancelBtn);

    wrap.append(
      field('cliente', 'Cliente', clienteI),
      docFieldE.element,
      field('whatsapp', 'WhatsApp do contato', whatsappI),
      field('vendedora', 'Vendedora', vendedoraSel),
      field('tipo', 'Tipo de coleta', tipoI),
      transpField, meField, rastreioFieldE,
      field('pedido', 'Nº do pedido', pedidoI),
      field('nf', 'NF', nfI),
      field('vol', 'Volumes', volI),
      field('obs', 'Observações (o que tem no pedido)', obsI),
      actions,
      msg
    );
    return wrap;
  }

  function orderRow(order) {
    const row = document.createElement('div');
    row.className = 'order-row ' + order.status;

    if (editingId === order.id) {
      const heading = document.createElement('div');
      heading.className = 'edit-heading';
      heading.textContent = 'Editando pedido de ' + (order.cliente || '');
      row.append(heading, buildEditor(order));
      return row;
    }

    const rowTop = document.createElement('div');
    rowTop.className = 'row-top';

    const statusBtn = document.createElement('button');
    statusBtn.className = 'status-btn ' + order.status;
    statusBtn.type = 'button';
    statusBtn.setAttribute('aria-label', order.status === 'pendente' ? 'Marcar como coletado' : 'Voltar para pendente');
    if (order.status === 'coletado') statusBtn.innerHTML = CHECK_SVG;
    statusBtn.addEventListener('click', () => toggleStatus(order));

    const clienteCell = document.createElement('div');
    clienteCell.className = 'cliente-cell';

    const nomeLine = document.createElement('div');
    nomeLine.className = 'nome-line';
    const nome = document.createElement('div');
    nome.className = 'nome';
    nome.textContent = order.cliente;

    const tipo = document.createElement('div');
    tipo.className = 'tipo-badge';
    let tipoLabel = TIPO_LABELS[order.tipoColeta] || order.tipoColeta;
    let extra = '';
    if (order.tipoColeta === 'transportadora' && order.transportadoraNome) {
      extra = ' <span class="extra">— ' + escapeHtml(order.transportadoraNome) + '</span>';
    } else if (order.tipoColeta === 'melhor_envio' && order.melhorEnvioServico) {
      extra = ' <span class="extra">— ' + escapeHtml(ME_LABELS[order.melhorEnvioServico] || order.melhorEnvioServico) + '</span>';
    }
    tipo.innerHTML = (ICONS[order.tipoColeta] || '') + '<span>' + tipoLabel + '</span>' + extra;

    nomeLine.append(nome, tipo);
    clienteCell.appendChild(nomeLine);

    if (order.whatsapp) {
      const contato = document.createElement('div');
      contato.className = 'contato-line';
      contato.innerHTML = WHATSAPP_SVG + '<span>' + escapeHtml(order.whatsapp) + '</span>';
      clienteCell.appendChild(contato);
    }
    if (order.documento) {
      const docLabel = order.documentoTipo === 'cpf' ? 'CPF' : 'CNPJ';
      const docLine = document.createElement('div');
      docLine.className = 'doc-line';
      docLine.textContent = docLabel + ' ' + order.documento;
      clienteCell.appendChild(docLine);
    }

    const rowActions = document.createElement('div');
    rowActions.className = 'row-actions';

    let pedidoCell = null;
    if (order.numeroPedido) {
      pedidoCell = document.createElement('div');
      pedidoCell.className = 'pedido-cell';
      pedidoCell.innerHTML = '<span class="k">pedido</span><span class="v">' + escapeHtml(order.numeroPedido) + '</span>';
    }

    const nfCell = document.createElement('div');
    nfCell.className = 'nf-cell';
    nfCell.innerHTML = '<span class="k">NF</span><span class="v">' + escapeHtml(order.nf) + '</span>';

    const volCell = document.createElement('div');
    volCell.className = 'vol-cell';
    volCell.innerHTML = '<span class="k">vol.</span><span class="v">' + order.volumes + '</span>';

    const editBtn = document.createElement('button');
    editBtn.className = 'edit-btn';
    editBtn.type = 'button';
    editBtn.innerHTML = PENCIL_SVG;
    editBtn.setAttribute('aria-label', 'Editar pedido');
    editBtn.addEventListener('click', () => {
      editingId = order.id;
      editingRowElement = null;
      pendingDeleteId = null;
      editingRastreioId = null;
      render();
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn' + (pendingDeleteId === order.id ? ' confirming' : '');
    delBtn.type = 'button';
    delBtn.innerHTML = TRASH_SVG;
    delBtn.setAttribute('aria-label', pendingDeleteId === order.id ? 'Confirmar exclusão' : 'Excluir lançamento');
    delBtn.addEventListener('click', () => requestDelete(order.id));

    if (pedidoCell) rowActions.appendChild(pedidoCell);
    rowActions.append(nfCell, volCell, editBtn, delBtn);
    rowTop.append(statusBtn, clienteCell, rowActions);
    row.appendChild(rowTop);

    const rowMeta = document.createElement('div');
    rowMeta.className = 'row-meta';

    if (order.vendedora) {
      const chip = document.createElement('span');
      chip.className = 'vendedora-chip';
      chip.innerHTML = '<span class="lbl">Vendedora</span><span>' + escapeHtml(order.vendedora) + '</span>';
      rowMeta.appendChild(chip);
    }

    const rastreio = rastreioSegment(order);
    if (rastreio) rowMeta.appendChild(rastreio);

    const timestamps = document.createElement('span');
    timestamps.className = 'timestamps';
    let metaText = 'lançado às ' + timeOnly(order.criadoEm) + (order.criadoPor ? ' por ' + escapeHtml(order.criadoPor) : '');
    if (order.status === 'coletado') {
      metaText += ' · coletado às ' + timeOnly(order.coletadoEm) + (order.coletadoPor ? ' por ' + escapeHtml(order.coletadoPor) : '');
    }
    timestamps.innerHTML = metaText;
    rowMeta.appendChild(timestamps);

    row.appendChild(rowMeta);

    if (order.obs) {
      const obsBox = document.createElement('div');
      obsBox.className = 'row-obs';
      obsBox.innerHTML = '<span class="lbl">Obs</span>' + escapeHtml(order.obs);
      row.appendChild(obsBox);
    }

    return row;
  }

  function rowForOrder(order) {
    if (editingId === order.id && editingRowElement) return editingRowElement;
    const rowEl = orderRow(order);
    if (editingId === order.id) editingRowElement = rowEl;
    return rowEl;
  }

  function render() {
    const pending = lastOrders.filter((o) => o.status === 'pendente');
    const collected = lastOrders.filter((o) => o.status === 'coletado');

    el('pendingCount').textContent = pending.length;
    el('collectedCount').textContent = collected.length;

    if (editingId && !lastOrders.some((o) => o.id === editingId)) {
      editingId = null;
      editingRowElement = null;
    }

    const pendingList = el('pendingList');
    pendingList.innerHTML = '';
    if (pending.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Nenhuma coleta pendente para este dia.';
      pendingList.appendChild(empty);
    } else {
      pending.forEach((o) => pendingList.appendChild(rowForOrder(o)));
    }

    const collectedList = el('collectedList');
    collectedList.innerHTML = '';
    if (collected.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Nenhuma coleta finalizada ainda.';
      collectedList.appendChild(empty);
    } else {
      collected.forEach((o) => collectedList.appendChild(rowForOrder(o)));
    }
  }

  async function toggleStatus(order) {
    const payload = order.status === 'pendente'
      ? { status: 'coletado', coletado_por: currentUser.id, coletado_em: new Date().toISOString() }
      : { status: 'pendente', coletado_por: null, coletado_em: null };
    const { error } = await sb.from('pedidos').update(payload).eq('id', order.id);
    if (error) console.error(error);
    await loadOrders();
  }

  async function requestDelete(id) {
    if (pendingDeleteId === id) {
      clearTimeout(pendingDeleteTimeout);
      pendingDeleteId = null;
      const { error } = await sb.from('pedidos').delete().eq('id', id);
      if (error) console.error(error);
      await loadOrders();
      return;
    }
    pendingDeleteId = id;
    render();
    pendingDeleteTimeout = setTimeout(() => {
      pendingDeleteId = null;
      render();
    }, 3000);
  }

  entryForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    formMsg.textContent = '';

    const cliente = el('clienteInput').value.trim();
    const documento = docField.getValue();
    const documentoTipo = docField.getTipo();
    const whatsapp = el('whatsappInput').value.trim();
    const vendedoraId = el('vendedoraInput').value;
    const numeroPedido = el('pedidoInput').value.trim();
    const nf = el('nfInput').value.trim();
    const volumes = parseInt(el('volInput').value, 10);
    const obs = el('obsInput').value.trim();
    const tipo = tipoInput.value;
    const transportadoraNome = tipo === 'transportadora' ? transportadoraInput.value.trim() : '';
    const melhorEnvioServico = tipo === 'melhor_envio' ? melhorEnvioInput.value : '';
    const linkRastreio = (tipo === 'transportadora' || tipo === 'melhor_envio') ? rastreioInput.value.trim() : '';

    if (!cliente || !vendedoraId || !nf || !volumes || volumes < 1) {
      formMsg.textContent = 'Preencha cliente, vendedora, NF e um número de volumes válido.';
      return;
    }

    addBtn.disabled = true;
    const { error } = await sb.from('pedidos').insert({
      data_coleta: currentDate,
      cliente: cliente,
      documento: documento || null,
      documento_tipo: documento ? documentoTipo : null,
      whatsapp: whatsapp || null,
      vendedora_id: vendedoraId,
      numero_pedido: numeroPedido || null,
      nf: nf,
      volumes: volumes,
      obs: obs || null,
      tipo_coleta: tipo,
      transportadora_nome: transportadoraNome || null,
      melhor_envio_servico: melhorEnvioServico || null,
      link_rastreio: linkRastreio || null
    });
    addBtn.disabled = false;

    if (error) {
      formMsg.textContent = 'Não foi possível salvar. Tente novamente.';
      console.error(error);
      return;
    }
    entryForm.reset();
    el('volInput').value = 1;
    docField.reset();
    syncTipoFields();
    buildVendedoraOptions(el('vendedoraInput'), currentUser.id);
    el('clienteInput').focus();
    await loadOrders();
  });
})();
</script>
</body>
</html>
