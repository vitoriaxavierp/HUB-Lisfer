<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadoras — Hub Lisfer</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="hub.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<style>
  .tool-rows { list-style: none; margin: 0; padding: 0; }
  .tool-rows a {
    display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 16px;
    padding: 18px 20px; border-bottom: 1px solid var(--border); text-decoration: none;
  }
  .tool-rows li:last-child a { border-bottom: 0; border-radius: 0 0 var(--r-lg) var(--r-lg); }
  .tool-rows li:first-child a { border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .tool-rows li:only-child a { border-radius: var(--r-lg); }
  .tool-rows a:hover { background: var(--surface-2); }
  .tool-rows .ic { width: 44px; height: 44px; border-radius: var(--r-md); background: var(--ink); color: var(--brand); display: grid; place-items: center; }
  .tool-rows .ic svg { width: 20px; height: 20px; }
  .tool-rows .name { font-size: var(--fs-md); font-weight: 600; }
  .tool-rows .desc { font-size: var(--fs-sm); color: var(--text-2); margin-top: 2px; }
  .tool-rows .go { color: var(--text-3); display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); font-weight: 500; }
  .tool-rows a:hover .go { color: var(--text); }
  .tool-rows .go svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<div class="app" id="appScreen" hidden>
  <aside class="app-sidebar" id="appSidebar" data-active="calculadoras"></aside>
  <div class="app-scrim"></div>
  <div class="app-main">
    <main class="page">
      <header class="page-header">
        <div class="page-header-text">
          <h1 class="page-title">Calculadoras</h1>
          <p class="page-desc">Precificação e lucratividade com as taxas reais de cada conta e marketplace.</p>
        </div>
      </header>
      <div class="panel" style="max-width:820px">
        <ul class="tool-rows" id="toolRows"></ul>
      </div>
    </main>
  </div>
</div>

<script>
(function () {
  const ic = HubIcons.svg;
  const TOOLS = [
    {
      "href": "calculadora-precos.html",
      "icon": "preco",
      "name": "Preços",
      "desc": "Informe o custo do produto e receba o preço de venda sugerido em cada marketplace."
    },
    {
      "href": "calculadora-lucratividade.html",
      "icon": "lucro",
      "name": "Lucratividade",
      "desc": "Informe o custo e o preço que você pratica e veja a margem de lucro, ou se está no prejuízo."
    }
  ];
  document.getElementById('toolRows').innerHTML = TOOLS.map((t) =>
    '<li><a href="' + t.href + '"><span class="ic">' + ic(t.icon) + '</span>' +
    '<span><div class="name">' + t.name + '</div><div class="desc">' + t.desc + '</div></span>' +
    '<span class="go">Abrir' + ic('chevronRight') + '</span></a></li>'
  ).join('');
  HubAuth.requireAuth(() => {
    document.getElementById('appScreen').hidden = false;
  });
})();
</script>
</body>
</html>
